<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <h1>Minesweeper</h1>
    <h2>Mines: <span>2</span></h2>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="onInit()">
    <button class="face" onclick="onInit()"></button>
    <div class="life"></div>


    <div class="flag"></div>

    <div class="board">

    </div>

    <div class="modal">
        <p></p>

    </div>


    <div class="difficulty">
        <h3>Difficulty</h3>
        <button class="btn-diff" data-size="4" data-mine="2" onclick="onDifficultyClick(this)">Easy</button>
        <button class="btn-diff" data-size="5" data-mine="3" onclick="onDifficultyClick(this)">Normal</button>
        <button class="btn-diff" data-size="6" data-mine="5" onclick="onDifficultyClick(this)">Hard</button>

    </div>




    <script src="Minesweeper.js"></script>
    <script src="utils.js"></script>
</body>

</html>
